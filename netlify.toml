# ═══════════════════════════════════════════════════════
# netlify.toml — Netlify deployment configuration
# Place this file in the ROOT of your repository
# ═══════════════════════════════════════════════════════

[build]
  # The folder Netlify will serve (our project root)
  publish = "."

  # No build command needed — pure HTML/CSS/JS
  # If you later add a build step (e.g. Vite), set it here:
  # command = "npm run build"
  # publish = "dist"

# ── Redirect all 404s to index.html (SPA behaviour) ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ──
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── No cache for index.html (always fresh) ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
